# Este archivo no se usa cuando Railway detecta Dockerfile
# Se mantiene por compatibilidad pero Railway usará el Dockerfile de la raíz
[build]
builder = "DOCKERFILE"
dockerfilePath = "../Dockerfile"

[deploy]
# Railway usará el CMD del Dockerfile
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
PYTHONUNBUFFERED = "1"

